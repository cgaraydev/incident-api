--project: cgaraydev-incident-api
--region: us-central1

--image: us-central1-docker.pkg.dev/cgaraydev-incident-api/incident-api/api:v2
--service-account: incident-api-runtime@cgaraydev-incident-api.iam.gserviceaccount.com

--port: 8080
--cpu: "1"
--memory: 512Mi
--min: 0
--max: 1
--concurrency: 8
--timeout: 90s
--cpu-throttling: true
--allow-unauthenticated: false

--env-vars-file: deploy/cloud-run-env.yaml

--set-secrets:
  DB_PASSWORD: incident-db-password:1
  GOOGLE_API_KEY: incident-gemini-api-key:1