services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: incident_db
      POSTGRES_USER: incident_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_dev -d incident_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: