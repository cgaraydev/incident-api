# Identidad de la aplicación
spring.application.name=incident-api

# Ocultar el banner de Spring
spring.main.banner-mode=off

# Puerto HTTP: variable PORT o 8080 si no está definida
server.port=${PORT:8080}

# Nivel general
# logging.level.root=INFO

# Nivel para nuestras clases
# logging.level.com.cgaraydev.incidentapi=DEBUG

# Análisis desactivado por defecto
app.analysis.enabled=false

# Modelo pendiente de seleccionar
app.analysis.model=${GEMINI_MODEL:}

# Límites para el futuro cliente
app.analysis.timeout=20s
app.analysis.max-output-tokens=512