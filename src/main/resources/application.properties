# Identidad de la aplicación
spring.application.name=incident-api

# Ocultar el banner de Spring
spring.main.banner-mode=off

# Puerto HTTP: variable PORT o 8080 si no está definida
server.port=${PORT:8080}

# Nivel general
# logging.level.root=INFO

# Nivel para nuestras clases
# logging.level.com.cgaraydev.incidentapi=DEBUG

# Análisis desactivado por defecto
app.analysis.enabled=false

# Modelo pendiente de seleccionar
app.analysis.model=${GEMINI_MODEL:}

# Límites para el futuro cliente
app.analysis.timeout=20s
app.analysis.max-output-tokens=512

# Identificador de la solicitud en los logs del mismo hilo
logging.pattern.level=%5p [requestId=%X{requestId:-none}]

# Exponer únicamente el endpoint de salud de Actuator
management.endpoints.web.exposure.include=health

# Mostrar solo el estado, sin detalles internos
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Habilitar los grupos de vida y preparación
management.endpoint.health.probes.enabled=true

# Vida: estado interno de la aplicación
management.endpoint.health.group.liveness.include=livenessState

# Preparación: estado interno y conexión a PostgreSQL
management.endpoint.health.group.readiness.include=readinessState,db